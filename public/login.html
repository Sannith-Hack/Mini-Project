<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MindFlow AI Premium Edition</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.95);
            color: #1f2937;
            font-weight: 600;
            font-size: 1rem;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        .google-btn:hover {
            background: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.3);
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--glass-border);
        }
        .divider::before { margin-right: .75em; }
        .divider::after { margin-left: .75em; }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="container" style="max-width: 450px; margin: auto;">
        <div class="glass-card">
            <h1 class="title" id="auth-title">Welcome Back</h1>
            <p class="subtitle" id="auth-subtitle">Log in to track your mental wellness journey</p>
            
            <!-- Google OAuth Button -->
            <a href="/api/auth/google" class="google-btn">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Continue with Google</span>
            </a>

            <div class="divider">Or continue with username</div>
            
            <form id="authForm">
                <input type="text" id="username" placeholder="Username" required autocomplete="username">
                <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
                <button type="submit" id="authBtn">Login</button>
            </form>
            
            <div class="toggle-text">
                <span id="toggleAuthMode">Don't have an account? Register here.</span>
            </div>
            
            <div style="text-align: center; margin-top: 20px; font-size: 0.8rem; color: var(--text-muted);">
                By continuing, you agree to our <a href="/terms.html" style="color: var(--primary); text-decoration: none;">Terms & Conditions</a> and Privacy Policy.
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const API_URL = window.location.origin;
        let isLoginMode = true;

        // Check if already logged in
        window.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            const username = localStorage.getItem('username');
            if (token && username) {
                window.location.href = '/index.html';
            }
        });

        const showToast = (msg, isError = false) => {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.borderLeft = isError ? '4px solid #ef4444' : '4px solid #22c55e';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        };

        document.getElementById('toggleAuthMode').addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').textContent = isLoginMode ? 'Welcome Back' : 'Create Account';
            document.getElementById('auth-subtitle').textContent = isLoginMode ? 'Log in to track your mental wellness journey' : 'Join MindFlow to manage your student stress';
            document.getElementById('authBtn').textContent = isLoginMode ? 'Login' : 'Register';
            document.getElementById('toggleAuthMode').textContent = isLoginMode ? "Don't have an account? Register here." : "Already have an account? Login here.";
        });

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('authBtn');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            if (!username || !password) return showToast('Please fill all fields', true);

            btn.disabled = true;
            btn.textContent = 'Processing...';

            const endpoint = isLoginMode ? '/login' : '/register';
            try {
                const res = await fetch(`${API_URL}/api/auth${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    showToast(data.message || 'Success!');
                    if (isLoginMode || data.token) {
                        if (data.token) localStorage.setItem('token', data.token);
                        if (data.username || username) localStorage.setItem('username', data.username || username);
                        setTimeout(() => {
                            window.location.href = '/index.html';
                        }, 500);
                    } else {
                        // Switch to login mode after successful registration
                        document.getElementById('toggleAuthMode').click();
                        showToast('Registered successfully! Please login.');
                    }
                } else {
                    showToast(data.error || 'Authentication failed', true);
                }
            } catch (err) {
                showToast('Server connection failed', true);
            } finally {
                btn.disabled = false;
                btn.textContent = isLoginMode ? 'Login' : 'Register';
            }
        });
    </script>
</body>
</html>
